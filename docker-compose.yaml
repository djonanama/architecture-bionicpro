version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - custom-bridge

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks:
      - custom-bridge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - keycloak
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://api:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
      REACT_APP_KEYCLOAK_ALGORITHM: S256
    networks:
      - custom-bridge

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    depends_on:
      - keycloak
    ports:
      - "8000:8000"
    environment:
      API_KEYCLOAK_URL: http://localhost:8080
      API_KEYCLOAK_REALM: reports-realm
      API_KEYCLOAK_ALGORITHM: RS256
      API_REPORT_KEYCLOAK_ROLE: prothetic_user
    networks:
      - custom-bridge

networks:
  custom-bridge:
    driver: bridge
